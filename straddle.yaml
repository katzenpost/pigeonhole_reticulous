# pigeonhole_reticulous — Pigeonhole apps on Reticulous; the first is katzenqt1 group chat.
#
# The node is a katzenqt1 client on a Reticulum mesh: it finds a Pigeonhole replica
# (pigeonhole.replica), keeps one Channel to it, and reads and writes the BACAP boxes
# of its groups through it. Speaks to rnsd only through rnsd.h.
schema_version: 1
name: katzenpost/pigeonhole_reticulous
prefix: kq
version: 0.1.0
firmware: esp-idf
platforms: [idf]
requires:
  - reticulous/rns
services:
  - { class: KqService, header: kq_service.h }
